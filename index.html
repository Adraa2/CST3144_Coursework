<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Vue.js Frontend Application: Renders lessons and handles cart checkout -->
    <title>After School Lessons</title>
    <meta charset="UTF-8">
    <title>Lesson Store</title>
    <!-- Vue.js CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .lesson-card { border: 1px solid #ccc; padding: 15px; margin: 10px; display: inline-block; width: 220px; vertical-align: top; text-align: center; border-radius: 8px; }
        .lesson-card img { width: 150px; height: 150px; object-fit: cover; }
        button { background-color: #28a745; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .remove-btn { background-color: #dc3545; }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <h1 v-text="sitename"></h1>
            <!-- Toggle Cart Button with Icon -->
            <button @click="toggleCart" :disabled="cartItemCount === 0">
                <i class="fa fa-shopping-cart" aria-hidden="true"></i> Checkout ({{ cartItemCount }})
            </button>
        </header>

        <main>
            <!-- SHOP VIEW -->
            <div v-if="!displayCart">
                <h2>Available Lessons</h2>
                <div v-for="lesson in sortedLessons" :key="lesson._id" class="lesson-card">
                    <figure>
                        <img :src="'http://localhost:3000/images/' + lesson.image" :alt="lesson.subject">
                    </figure>
                    <h2 v-text="lesson.subject"></h2>
                    <p>Location: {{ lesson.location }}</p>
                    <p>Price: £{{ lesson.price }}</p>
                    <p>Spaces: {{ lesson.spaces }}</p>

                    <!-- Add to Cart Button -->
                    <button @click="addToCart(lesson)" :disabled="lesson.spaces === 0">
                        Add to Cart
                    </button>
                </div>
            </div>

            <!-- CHECKOUT VIEW -->
            <div v-else>
                <h2>Shopping Cart</h2>
                <ul>
                    <li v-for="(item, index) in cart" :key="item._id">
                        {{ item.subject }} - £{{ item.price }} 
                        <button class="remove-btn" @click="removeFromCart(item, index)">Remove</button>
                    </li>
                </ul>

                <h3>Checkout</h3>
                <p>Name: <input v-model.trim="order.name" placeholder="Enter your name"></p>
                <p>Phone: <input v-model.trim="order.phone" placeholder="Enter phone number"></p>

                <button @click="submitForm" :disabled="!canCheckout">Place Order</button>
                <button @click="toggleCart">Return to Store</button>
            </div>
        </main>
    </div>

    <script type="module">
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    sitename: "Lesson Store",
                    lessons: [],
                    cart: [],
                    displayCart: false,
                    order: {
                        name: '',
                        phone: ''
                    },
                    sortAttribute: 'subject',
                    sortOrder: 'asc'
                }
            },
            created() {
                this.fetchData();
            },
            computed: {
                cartItemCount() {
                    return this.cart.length;
                },
                isValidName() {
                    return /^[a-zA-Z\s]+$/.test(this.order.name);
                },
                isValidPhone() {
                return /^[0-9]{10,}$/.test(this.order.phone);
                },
                canCheckout() {
                    return this.isValidName && this.isValidPhone && this.cart.length > 0;
                },
                sortedLessons() {
                    var lessonsArray = this.lessons.slice();
                    var attribute = this.sortAttribute;
                    var order = this.sortOrder;

                    return lessonsArray.sort(function(a, b) {
                        var aValue = a[attribute];
                        var bValue = b[attribute];

                        if (typeof aValue === 'string') {
                            aValue = aValue.toLowerCase();
                            bValue = bValue.toLowerCase();
                        }

                        if (aValue < bValue) {
                            return order === 'asc' ? -1 : 1;
                        }
                        if (aValue > bValue) {
                            return order === 'asc' ? 1 : -1;
                        }
                        return 0;
                    });
                }
            },
            methods: {
                async fetchData() {
                    try {
                        // Fixed route to match singular /collection/lessons in server.js
                        var response = await fetch("http://localhost:3000/collection/lessons");
                        var serverData = await response.json();
                        if (Array.isArray(serverData)) {
                            this.lessons = serverData;
                        } else {
                            console.log("Invalid server data format:", serverData);
                            this.lessons = [];
                        }
                    } catch (error) {
                        console.log("Error loading lessons from server: " + error);
                    }
                },
                addToCart(lesson) {
                    if (lesson.spaces > 0) {
                        lesson.spaces--;
                        this.cart.push(lesson);
                    }
                },
                removeFromCart(item, index) {
                    this.cart.splice(index, 1);
                    item.spaces++;
                    if (this.cart.length === 0) {
                        this.displayCart = false;
                    }
                },
                toggleCart() {
                    this.displayCart = !this.displayCart;
                },
                async submitForm() {
                    var newOrder = {
                        name: this.order.name,
                        phone: this.order.phone,
                        cart: this.cart
                    };

                    try {
                        // 1. Post the order to the backend
                        var response = await fetch("http://localhost:3000/collection/orders", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(newOrder)
                        });
                        var result = await response.json();

                        // 2. Wait for all lessons in the cart to update their spaces via PUT requests
                        await Promise.all(
                            this.cart.map(lesson => {
                                return fetch(`http://localhost:3000/collections/lessons/${lesson._id}`, {
                                    method: "PUT",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({
                                        spaces: lesson.spaces
                                    })
                                })
                                .then(res => res.json())
                                .then(data => console.log("Space updated:", data));
                            })
                        );

                        alert('Order submitted successfully!');
                        
                        // 3. Clear form and cart data
                        this.cart = [];
                        this.order.name = '';
                        this.order.phone = '';
                        this.displayCart = false;

                        // 4. Refresh lessons from database
                        this.fetchData();

                    } catch (error) {
                        console.log("Error submitting order: " + error);
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
