<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Web App</title>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .controls {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls label {
            margin-right: 10px;
            font-weight: bold;
        }
        .controls select, .controls input {
            margin-right: 15px;
            padding: 5px;
        }
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
        }
        button {
            padding: 8px 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .cart-section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <h1>Lesson Store</h1>
            <!-- Cart Toggle Button -->
            <button @click="toggleCart" :disabled="cart.length === 0">
                <i class="fa-solid fa-cart-shopping"></i> Cart ({{ cart.length }})
            </button>
        </header>

        <!-- Lessons Page View -->
        <div v-if="displayCart === false">
            
            <!-- Task 4.6 Sort Controls -->
            <div class="controls">
                <label for="sortAttribute">Sort By:</label>
                <select id="sortAttribute" v-model="sortAttribute">
                    <option value="subject">Subject</option>
                    <option value="location">Location</option>
                    <option value="price">Price</option>
                    <option value="spaces">Spaces</option>
                </select>

                <label>Order:</label>
                <input type="radio" id="asc" value="asc" v-model="sortOrder">
                <label for="asc">Ascending</label>
                <input type="radio" id="desc" value="desc" v-model="sortOrder">
                <label for="desc">Descending</label>
            </div>

            <!-- Lessons Display -->
            <div class="lesson-grid">
                <div v-for="lesson in sortedLessons" :key="lesson.id" class="card">
                    <img :src="lesson.image" :alt="lesson.subject">
                    <h3>{{ lesson.subject }}</h3>
                    <p>Location: {{ lesson.location }}</p>
                    <p>Price: £{{ lesson.price }}</p>
                    <p>Spaces: {{ lesson.spaces }}</p>
                    
                    <button @click="addToCart(lesson)" :disabled="lesson.spaces === 0">
                        Add to Cart
                    </button>
                </div>
            </div>

        </div>

        <!-- Cart & Checkout View -->
        <div v-else class="cart-section">
            <h2>Shopping Cart</h2>
            <div v-if="cart.length > 0">
                <ul>
                    <li v-for="(item, index) in cart" :key="index">
                        {{ item.subject }} - £{{ item.price }}
                        <button @click="removeFromCart(item, index)">Remove</button>
                    </li>
                </ul>

                <h3>Checkout</h3>
                <form @submit.prevent="submitForm">
                    <p>
                        <label>Name:</label>
                        <input type="text" v-model="order.name" required>
                    </p>
                    <p>
                        <label>Phone:</label>
                        <input type="text" v-model="order.phone" required>
                    </p>
                    <button type="submit" :disabled="!order.name || !order.phone">Checkout</button>
                </form>
            </div>
            <div v-else>
                <p>Your cart is empty.</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    // Task 4.5: Lessons initialized as empty array to be fetched from backend
                    lessons: [],
                    cart: [],
                    displayCart: false,
                    
                    // Task 4.6: Sorting properties
                    sortAttribute: 'price',
                    sortOrder: 'asc',

                    // Checkout data
                    order: {
                        name: '',
                        phone: ''
                    }
                }
            },
            
            // Task 4.5: Fetch data when Vue instance is created
            created() {
                this.fetchData();
            },

            methods: {
                // Task 4.5: Fetch lesson data from Express server
                async fetchData() {
                    try {
                        var response = await fetch("http://localhost:3000/");
                        this.lessons = await response.json();
                    } catch (error) {
                        console.log("Error fetching lessons: " + error);
                    }
                },

                // Add lesson to cart
                addToCart(lesson) {
                    if (lesson.spaces > 0) {
                        lesson.spaces--;
                        this.cart.push(lesson);
                    }
                },

                // Remove lesson from cart and return space back
                removeFromCart(item, index) {
                    this.cart.splice(index, 1);
                    item.spaces++;
                    if (this.cart.length === 0) {
                        this.displayCart = false;
                    }
                },

                // Toggle between cart and lesson list
                toggleCart() {
                    this.displayCart = !this.displayCart;
                },

                // Submit order form
                submitForm() {
                    alert('Order submitted successfully!');
                    this.cart = [];
                    this.order.name = '';
                    this.order.phone = '';
                    this.displayCart = false;
                }
            },

            computed: {
                // Task 4.6: Sorting functionality
                sortedLessons() {
                    var lessonsArray = this.lessons.slice();
                    var attribute = this.sortAttribute;
                    var order = this.sortOrder;

                    return lessonsArray.sort(function(a, b) {
                        var aValue = a[attribute];
                        var bValue = b[attribute];

                        if (typeof aValue === 'string') {
                            aValue = aValue.toLowerCase();
                            bValue = bValue.toLowerCase();
                        }

                        if (aValue < bValue) {
                            return order === 'asc' ? -1 : 1;
                        }
                        if (aValue > bValue) {
                            return order === 'asc' ? 1 : -1;
                        }
                        return 0;
                    });
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
